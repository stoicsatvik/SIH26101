<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="description" content="GyanSetu, an independent SIH26101 student hackathon prototype for competency-driven learning."/>
  <title>GyanSetu | SIH26101 Prototype</title>
  <link rel="stylesheet" href="./ui/gyansetu-components.css"/>
</head>
<body class="gs-page">
  <main class="gs-shell">
    <div class="gs-wave-lines" aria-hidden="true"></div>
    <div class="gs-dot-field gs-dot-field--top" aria-hidden="true"></div>
    <div class="gs-dot-field gs-dot-field--bottom" aria-hidden="true"></div>

    <span class="gs-float-icon gs-float-icon--book" aria-hidden="true"><svg><use href="./ui/gyansetu-icons.svg#icon-book"/></svg></span>
    <span class="gs-float-icon gs-float-icon--chart" aria-hidden="true"><svg><use href="./ui/gyansetu-icons.svg#icon-chart"/></svg></span>
    <span class="gs-float-icon gs-float-icon--cap" aria-hidden="true"><svg><use href="./ui/gyansetu-icons.svg#icon-cap"/></svg></span>
    <span class="gs-float-icon gs-float-icon--bulb" aria-hidden="true"><svg><use href="./ui/gyansetu-icons.svg#icon-bulb"/></svg></span>
    <span class="gs-float-icon gs-float-icon--gear" aria-hidden="true"><svg><use href="./ui/gyansetu-icons.svg#icon-gear"/></svg></span>

    <section class="gs-hero" aria-labelledby="gyansetu-title">
      <img class="gs-logo" src="./ui/gyansetu-logo.svg" alt="GyanSetu logo"/>
      <h1 class="gs-brand-word" id="gyansetu-title">GyanSetu</h1>
      <div class="gs-brand-rule" aria-hidden="true"><svg><use href="./ui/gyansetu-icons.svg#icon-cap"/></svg></div>
      <p class="gs-tagline">Bridging competency gaps through learning</p>

      <nav class="gs-actions" aria-label="Account actions">
        <a class="gs-cta" href="./login.html">
          <span class="gs-cta__icon"><svg><use href="./ui/gyansetu-icons.svg#icon-login"/></svg></span>
          <span>Log In</span>
          <svg class="gs-cta__arrow"><use href="./ui/gyansetu-icons.svg#icon-arrow"/></svg>
        </a>
        <a class="gs-cta" href="./register.html">
          <span class="gs-cta__icon"><svg><use href="./ui/gyansetu-icons.svg#icon-register"/></svg></span>
          <span>Register</span>
          <svg class="gs-cta__arrow"><use href="./ui/gyansetu-icons.svg#icon-arrow"/></svg>
        </a>
      </nav>
    </section>

    <div class="gs-building" aria-hidden="true">
      <svg viewBox="0 0 720 180" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round">
        <path d="M45 157h630M78 157V97h70v60M572 157V96h70v61M186 157V82h104v75M430 157V82h104v75M305 157V54h110v103M323 54h74M342 54V37h39v17M360 37V23M360 23l17 8h-17"/>
        <path d="M92 97l21-24 21 24M202 82l36-30 36 30M446 82l36-30 36 30M322 54l38-34 38 34M588 96l19-23 20 23"/>
        <path d="M105 157v-35m17 35v-35M221 157v-46m28 46v-46M464 157v-46m28 46v-46M338 157V94m22 63V94m22 63V94M600 157v-35m17 35v-35"/>
      </svg>
    </div>

    <p class="gs-disclaimer">Independent SIH26101 student hackathon prototype. GyanSetu is not an official Government of India or iGOT Karmayogi authentication service.</p>
  </main>
</body>
</html>
